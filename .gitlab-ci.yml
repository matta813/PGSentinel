workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

stages: [validate, lint, test, build, renovate, release]

default:
  interruptible: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [.cache/go-build, .cache/go-mod, frontend/node_modules/]

variables:
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GIT_DEPTH: "0"

release-validation:
  stage: validate
  image: alpine:3.24
  before_script: ["apk add --no-cache git"]
  script:
    - git fetch --tags --force
    - PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
    - PREVIOUS_VERSION="${PREVIOUS_TAG#v}" ./scripts/validate-release.sh RELEASE
  artifacts:
    reports: {dotenv: release.env}
    expire_in: 1 day
  rules: &release_rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [RELEASE]
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RETRY_RELEASE == "true"'
    - when: never

release-logic-test:
  stage: validate
  image: alpine:3.24
  before_script: ["apk add --no-cache git"]
  script:
    - SKIP_REMOTE_CHECK=true ./scripts/validate-release.sh RELEASE
    - ./scripts/test-release.sh
    - ./scripts/test-release-notes.sh
    - ./scripts/test-ci-release-rules.sh

go-lint:
  stage: lint
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git"]
  script:
    - test -z "$(gofmt -l $(find cmd internal migrations -name '*.go'))"
    - go vet ./...

frontend-lint:
  stage: lint
  image: node:24-alpine
  before_script: ["npm ci --prefix frontend"]
  script:
    - npm --prefix frontend run lint
    - npm --prefix frontend run typecheck

go-test:
  stage: test
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git build-base"]
  script: ["CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./..."]
  coverage: '/total:.*\(statements\).*?([0-9.]+)%/'
  artifacts: {paths: [coverage.out], expire_in: 1 week}

frontend-test:
  stage: test
  image: node:24-alpine
  before_script: ["npm ci --prefix frontend"]
  script: ["npm --prefix frontend test -- --run"]

build:
  stage: build
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git nodejs npm", "npm ci --prefix frontend"]
  script:
    - npm --prefix frontend run build
    - CGO_ENABLED=0 go build -trimpath -o pgsentinel ./cmd/pgsentinel
  artifacts: {paths: [pgsentinel, frontend/dist/], expire_in: 1 week}

renovate:
  stage: renovate
  image: renovate/renovate:44.2.1
  resource_group: renovate
  interruptible: false
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_ENDPOINT: "https://gitlab.scruzzi.com/api/v4/"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
    RENOVATE_REPOSITORIES: "root/postgresqlui"
    LOG_LEVEL: "info"
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_RENOVATE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_RENOVATE == "true"'
    - when: never

publish-release:
  stage: release
  interruptible: false
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    HEALTHCHECK_TCP_PORT: "2375"
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  resource_group: production-release
  needs:
    - job: release-validation
      artifacts: true
    - job: go-test
    - job: frontend-test
    - job: build
  before_script:
    - apk add --no-cache git glab
    - git fetch --tags --force
    - docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
    - ./scripts/release-notes.sh "$RELEASE_VERSION" "$PREVIOUS_TAG" > release-notes.md
    - BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - docker build --provenance=false --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT_SHA="$CI_COMMIT_SHA" --build-arg BUILD_TIME="$BUILD_TIME" -t "$CI_REGISTRY_IMAGE:$RELEASE_VERSION" .
    - docker tag "$CI_REGISTRY_IMAGE:$RELEASE_VERSION" "$CI_REGISTRY_IMAGE:$RELEASE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$RELEASE_VERSION"
    - docker push "$CI_REGISTRY_IMAGE:$RELEASE_TAG"
    - if [ "$RELEASE_STABLE" = "true" ]; then docker tag "$CI_REGISTRY_IMAGE:$RELEASE_VERSION" "$CI_REGISTRY_IMAGE:latest" && docker push "$CI_REGISTRY_IMAGE:latest"; fi
    - glab release create "$RELEASE_TAG" --name "PGSentinel $RELEASE_TAG" --notes-file release-notes.md --ref "$CI_COMMIT_SHA" --tag-message "PGSentinel $RELEASE_TAG"
  artifacts:
    paths: [release-notes.md]
    expire_in: 1 month
  rules: *release_rules
