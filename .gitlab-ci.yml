stages: [lint, test, build, docker]
default:
  interruptible: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [.cache/go-build, .cache/go-mod, frontend/node_modules/]
variables:
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod

go-lint:
  stage: lint
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git"]
  script:
    - test -z "$(gofmt -l $(find cmd internal migrations -name '*.go'))"
    - go vet ./...

frontend-lint:
  stage: lint
  image: node:24-alpine
  before_script: ["npm ci --prefix frontend"]
  script:
    - npm --prefix frontend run lint
    - npm --prefix frontend run typecheck

go-test:
  stage: test
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git"]
  script: ["go test -race -coverprofile=coverage.out ./..."]
  coverage: '/total:.*\(statements\).*?([0-9.]+)%/'
  artifacts: {paths: [coverage.out], expire_in: 1 week}

frontend-test:
  stage: test
  image: node:24-alpine
  before_script: ["npm ci --prefix frontend"]
  script: ["npm --prefix frontend test -- --run"]

build:
  stage: build
  image: golang:1.26-alpine
  before_script: ["apk add --no-cache git nodejs npm", "npm ci --prefix frontend"]
  script: ["npm --prefix frontend run build", "CGO_ENABLED=0 go build -trimpath -o pgsentinel ./cmd/pgsentinel"]
  artifacts: {paths: [pgsentinel, frontend/dist/], expire_in: 1 week}

container:
  stage: docker
  image: docker:29-cli
  services: [docker:29-dind]
  variables: {DOCKER_TLS_CERTDIR: "/certs"}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --build-arg VERSION="$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest" && docker push "$CI_REGISTRY_IMAGE:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" && docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
