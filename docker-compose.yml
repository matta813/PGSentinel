services:
  pgsentinel:
    build: .
    image: pgsentinel:local
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: Europe/Zurich
      PGSENTINEL_ENCRYPTION_KEY: ${PGSENTINEL_ENCRYPTION_KEY:-development-only-change-this-key}
      PGSENTINEL_STATS_INTERVAL: 30s
    volumes: [pgsentinel-data:/data]
    depends_on:
      postgres-test: {condition: service_healthy}
  postgres-test:
    image: postgres:18-alpine
    command: ["postgres","-c","shared_preload_libraries=pg_stat_statements","-c","track_io_timing=on"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-demo-only
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres -d demo"], interval: 5s, timeout: 3s, retries: 20}
volumes:
  pgsentinel-data:
  postgres-data:
