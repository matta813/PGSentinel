services:
  pgsentinel:
    image: ${PGSENTINEL_IMAGE:-ghcr.io/matta813/pgsentinel}:${PGSENTINEL_VERSION:-0.8.2}
    container_name: pgsentinel
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: /tmp:rw,noexec,nosuid,nodev,size=64m
    ports: ["8080:8080"]
    environment:
      TZ: Europe/Zurich
      PGSENTINEL_ENCRYPTION_KEY: ${PGSENTINEL_ENCRYPTION_KEY:?set PGSENTINEL_ENCRYPTION_KEY}
      PGSENTINEL_ADMIN_PASSWORD: ${PGSENTINEL_ADMIN_PASSWORD:?set PGSENTINEL_ADMIN_PASSWORD}
      PGSENTINEL_SECURE_COOKIES: ${PGSENTINEL_SECURE_COOKIES:-false}
      PGSENTINEL_TRUSTED_PROXY_CIDRS: ${PGSENTINEL_TRUSTED_PROXY_CIDRS:-}
      PGSENTINEL_NOTIFICATION_ALLOWED_HOSTS: ${PGSENTINEL_NOTIFICATION_ALLOWED_HOSTS:-}
      PGSENTINEL_ALLOW_PRIVATE_NOTIFICATION_TARGETS: ${PGSENTINEL_ALLOW_PRIVATE_NOTIFICATION_TARGETS:-false}
      PGSENTINEL_STATS_INTERVAL: ${PGSENTINEL_STATS_INTERVAL:-30s}
    volumes: [pgsentinel-data:/data]
volumes:
  pgsentinel-data:
