services:
  pgsentinel:
    build: .
    image: pgsentinel:local
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: Europe/Zurich
      PGSENTINEL_ENCRYPTION_KEY: ${PGSENTINEL_ENCRYPTION_KEY:-development-only-change-this-key}
      PGSENTINEL_STATS_INTERVAL: 30s
    volumes: [pgsentinel-data:/data]
volumes:
  pgsentinel-data:
