services:
  pgsentinel:
    image: ${PGSENTINEL_IMAGE:-ghcr.io/matta813/pgsentinel}:${PGSENTINEL_VERSION:-0.1.0}
    container_name: pgsentinel
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m]
    ports: ["8080:8080"]
    environment:
      TZ: Europe/Zurich
      PGSENTINEL_ENCRYPTION_KEY: ${PGSENTINEL_ENCRYPTION_KEY:?set PGSENTINEL_ENCRYPTION_KEY}
      PGSENTINEL_STATS_INTERVAL: ${PGSENTINEL_STATS_INTERVAL:-30s}
    volumes: [pgsentinel-data:/data]
volumes:
  pgsentinel-data:
