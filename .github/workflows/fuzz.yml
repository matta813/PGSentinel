name: Go Fuzzing

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/storage/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "11 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encryption:
    name: Fuzz credential encryption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz encryption round trips and tamper detection
        run: go test ./internal/storage -run=^$ -fuzz=^FuzzCipherRoundTrip$ -fuzztime=30s
