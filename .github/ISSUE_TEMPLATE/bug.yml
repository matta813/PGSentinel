name: Bug report
description: Report reproducible incorrect behavior in PGSentinel
title: "bug: "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PGSentinel. Remove credentials and sensitive query text from all logs and screenshots.
  - type: input
    id: version
    attributes:
      label: PGSentinel version
      description: The release tag or commit SHA, visible in Settings.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: PostgreSQL 17.5
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Docker or Podman
        - Local source build
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact hostnames, credentials, tokens, IPs, and sensitive query text.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
